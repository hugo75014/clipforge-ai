# =============================================================================
# Netlify configuration — frontend only
# =============================================================================
# The backend (FastAPI + Celery + workers) is NOT supported by Netlify and
# should be deployed to Render / Railway / Fly.io. See DEPLOY.md.

[build]
  base    = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Vite reads VITE_* at build time. Set this to your backend URL.
  VITE_API_URL = "https://api.clip.viralcuts.live"

# SPA fallback — every unknown path serves index.html so React Router works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (defense in depth; the backend has its own auth).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "DENY"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache static assets aggressively, but always revalidate index.html.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Proxy /api and /media to the FastAPI backend.
# Configure `BACKEND_URL` in the Netlify UI (Site settings → Environment).
[[redirects]]
  from = "/api/*"
  to = ":BACKEND_URL/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = ":BACKEND_URL/media/:splat"
  status = 200
  force = true
