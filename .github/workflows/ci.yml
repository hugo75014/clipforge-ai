name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # Backend tests (Python)
  # ===========================================================================
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clipforge
          POSTGRES_PASSWORD: clipforge
          POSTGRES_DB: clipforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://clipforge:clipforge@postgres:5432/clipforge_test
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /tmp/clipforge-test
      DEMO_MODE: "true"
      SECRET_KEY: test-secret-key-for-ci-only
      JWT_SECRET: test-jwt-secret-for-ci-only
      TRANSCRIPTION_PROVIDER: demo
      AI_PROVIDER: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python deps
        run: |
          pip install -e ".[dev]"
          pip install email-validator
      - name: Run tests
        run: pytest -q --cov=app --cov=video_engine --cov=ai_engine --cov-report=term-missing
      - name: Ruff lint
        run: |
          pip install ruff
          ruff check .

  # ===========================================================================
  # Frontend build + lint
  # ===========================================================================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
